name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bootstrap pinned compiler and libraries
        run: ./tools/bootstrap.sh
      - name: Test CPU numerics and persistence
        run: ./tools/zig build test-cpu test-build -Doptimize=ReleaseSafe
      - name: Package application and corresponding sources
        run: ./tools/release.sh
      - name: Attest release files
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Mandel-macos-arm64.zip
            dist/Mandel-source.tar.gz
      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mandel-macos-arm64
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "Mandel $RELEASE_TAG" --notes-file .github/release-notes.md
